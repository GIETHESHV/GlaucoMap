# GlaucoMap ML — Base Configuration

model:
  gnn:
    num_layers: 3
    hidden_dim: 64
    output_dim: 64
    heads: 4                  # GAT attention heads
    dropout: 0.2
    skip_connections: true
    bundle_coherence_weight: 0.1   # anatomical loss weight
    asymmetry_prior_weight: 0.05

  spatiotemporal:
    hidden_dim: 128
    gru_layers: 2
    dropout: 0.2
    time_encoding_dim: 32     # sinusoidal time-delta encoding size
    output_locations: 54      # VF test locations
    heteroscedastic: true     # predict mean + log-variance

  measurement_noise:
    henson_a: 0.081           # Henson curve parameter a
    henson_b: 0.473           # Henson curve parameter b (SD = a * sensitivity^b)

training:
  batch_size: 32
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  max_epochs: 100
  early_stopping_patience: 10
  scheduler: cosine
  warmup_epochs: 5
  grad_clip: 1.0
  seed: 42

data:
  min_sessions: 3             # minimum sessions per patient for training
  max_sessions: 20
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15
  reliability:
    max_false_positive_rate: 0.15
    max_false_negative_rate: 0.20
    max_fixation_loss_rate: 0.20
  sensitivity_range: [0, 40]  # valid dB range

progression:
  alert_threshold_db_per_year: 1.0   # dB/year decline to flag
  alert_min_locations: 3             # locations in same bundle
  alert_min_sessions: 3
  uncertainty_suppression_factor: 2.0  # suppress if uncertainty > 2x noise
  vfi_event_threshold: 85            # VFI < 85% = event

paths:
  graph: ml/data/rnfb_graph.pt
  checkpoints: ml/checkpoints/
  figures: docs/figures/

wandb:
  project: glaucomap
  entity: null   # set your W&B entity here
